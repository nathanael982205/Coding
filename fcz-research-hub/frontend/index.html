<!doctype html>
<html lang="de">
<head>

</head>
<body>
<div class="app">

      <a href="#/library" data-route="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2V5z"/><path d="M4 19a2 2 0 0 1 2-2h12v4H6a2 2 0 0 1-2-2z"/></svg>Studienbibliothek<span class="count" id="nav-count"></span></a>

      <a href="#/compare" data-route="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="7" height="16" rx="1.5"/><rect x="14" y="4" width="7" height="16" rx="1.5"/></svg>Studienvergleich<span class="count" id="nav-cmp"></span></a>

      <a href="#/methods" data-route="methods"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg>Methodik-Assistent</a>

      <span class="ai-pill" id="ai-pill"><span class="dot"></span>Status wird geladen …</span>

  <div class="main">

<div class="toasts" id="toasts"></div>
<script type="module" src="js/app.js"></script>

</html>
